# Source chosen: customers.csv
# Reason: It has a clear primary key (customer_id), a well-defined flat structure, and directly
# observable data-quality issues (duplicates, missing emails) found during profiling, making it
# a good candidate for demonstrating explicit, evidence-based contract rules.

dataset_name: customers
version: 1.0
owner: "unknown - requires source owner confirmation"
source_type: file
source_format: csv
acquisition_method: "Direct file read via pandas.read_csv, assumed to be exported/dropped into a shared location"
expected_update_pattern: "batch - likely daily; signups happen continuously but this file is a periodic export"
primary_key: customer_id

schema:
  - name: customer_id
    type: string
    nullable: false
    description: "Unique identifier for each customer"
  - name: first_name
    type: string
    nullable: false
    description: "Customer's first name"
  - name: last_name
    type: string
    nullable: false
    description: "Customer's last name"
  - name: email
    type: string
    nullable: true
    description: "Customer's email address; 3 nulls observed during profiling"
  - name: city
    type: string
    nullable: true
    description: "Customer's city; 2 nulls observed during profiling"
  - name: signup_date
    type: date
    nullable: true
    description: "Date the customer signed up"
  - name: customer_segment
    type: string
    nullable: false
    description: "Business segment classification; observed values are Retail, Professional, SME, Student"

quality_rules:
  - "customer_id must not be null and must be unique"
  - "customer_segment must be one of: Retail, Professional, SME, Student"
  - "email, when present, must match a valid email format (user@domain)"
  - "the dataset must contain no fully duplicated rows (2 were found during profiling and should be removed before loading)"

freshness_expectation: "unknown - requires confirmation from source owner on export schedule"
duplicate_policy: deduplicate
schema_evolution_policy: "New columns or new customer_segment values should be reviewed and the schema/CHECK constraint updated before being loaded into lab.customers; unexpected columns should be flagged, not silently dropped"
consumer: "Marketing team (segmentation and outreach), Analytics team (customer reporting)"
notes: "2 duplicate rows and missing values in email (3) and city (2) were found during profiling (Task 2.2). Duplicate policy and email format rule are informed directly by this evidence."