source_name: customers.csv
owner: "Vince Martin Malicdem"
description: "Customer records collected via signup form, including contact info, location, and segment classification."

schema:
  - name: "customer_id"
    type: "string"
    nullable: false
    description: "Unique identifier for each customer"
  - name: "first_name"
    type: "string"
    nullable: false
    description: "Customer's first name"
  - name: "last_name"
    type: "string"
    nullable: false
    description: "Customer's last name"
  - name: "email"
    type: "string"
    nullable: true
    description: "Customer's email address, may be missing"
  - name: "city"
    type: "string"
    nullable: true
    description: "Customer's city, may be missing"
  - name: "signup_date"
    type: "date"
    nullable: false
    description: "Date the customer signed up"
  - name: "customer_segment"
    type: "string"
    nullable: false
    description: "Business segment classification (Retail, Professional, SME, Student)"

primary_key: "customer_id"
update_frequency: "Batch export, likely daily. Signups happen continuously but this file is refreshed on a schedule"

quality_expectations:
  - "customer_id should be unique across all rows"
  - "email should not be null for more than a small percentage of records"
  - "signup_date should be a valid, parseable date"

consumers:
  - "Marketing team, for segmentation and outreach"
  - "Analytics team, for customer reporting"

change_management: "Schema changes should be communicated via a changelog or versioned schema file before being deployed to production"